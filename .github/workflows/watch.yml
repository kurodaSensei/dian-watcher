name: watch

on:
  schedule:
    - cron: '7 */4 * * *' # cada 4 h, en UTC (19:07, 23:07, 03:07, 07:07, 11:07, 15:07 en Colombia)
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Enviar una notificación de prueba al celular'
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Cache del navegador de Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Revisar citas
        run: npm run check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_TEST: ${{ inputs.prueba && '1' || '0' }}

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: state-${{ github.run_id }}

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
